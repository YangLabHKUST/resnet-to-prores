# CIFAR-10 Training Configuration

# Experiment Configuration
experiment:
  job_name: "resnet101_postnorm"
  work_dir: "./results/cifar10"

# Data Configuration
data:
  dataset: "cifar10"  # Options: "imagenet100", "cifar10"
  root: "./data"  # Dataset root directory
  num_classes: 10
  img_size: 32  # Use 224 for ImageNet, 32 for CIFAR-10 (native resolution)
  num_workers: 16
  pin_memory: true

# Model Configuration
model:
  name: "resnet101"
  pretrained: false  # Whether to use pretrained weights
  norm_type: "post"
  
  # ProRes Configuration
  prores:
    enabled: false
    T: 1.0

# Training Configuration
training:
  epochs: 100
  batch_size: 2048
  
  # Optimizer Configuration
  optimizer:
    type: "AdamW"
    lr: 0.001
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.999
  
  # Learning Rate Scheduler
  scheduler:
    type: "warmup_cosine"  # Options: warmup_cosine, step
    warmup_epochs: 5
    min_lr: 0.0
  
  # Loss Function Configuration
  criterion:
    type: "CrossEntropyLoss"
    label_smoothing: 0.1

# Mixed Precision Training
amp:
  enabled: true

# Miscellaneous Configuration
misc:
  seed: 42
  device: "cuda"
  
# Checkpoint Configuration
checkpoint:
  save_dir: "checkpoints"
  save_freq: 10  # Save checkpoint every N epochs
  resume: ""  # Path to checkpoint for resuming training

# Evaluation Configuration
eval:
  eval_only: false
  eval_freq: 1  # Evaluate every N epochs

# Logging Configuration
logging:
  log_dir: "logs"
  print_freq: 1  # Print log every N batches
